name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/compatibility-check.rb"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/compatibility-check.rb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: site

      - name: Check the compatibility data
        run: ruby tools/compatibility-check.rb

      # Pages is only read once it serves this site; a pull request builds for /Bridge32.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build the site
        working-directory: site
        run: bundle exec jekyll build --strict_front_matter --baseurl "$BASE_PATH"
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ github.event_name == 'pull_request' && '/Bridge32' || steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; one already running is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
